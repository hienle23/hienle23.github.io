<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <defs>
    <radialGradient id="bSkin" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#f5d5bc"/>
      <stop offset="100%" stop-color="#e8b898"/>
    </radialGradient>
    <radialGradient id="bFaceShadow" cx="50%" cy="65%" r="50%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#d4956a" stop-opacity="0.2"/>
    </radialGradient>
    <radialGradient id="bBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1040"/>
      <stop offset="100%" stop-color="#0d0820"/>
    </radialGradient>
    <radialGradient id="bEye" cx="35%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#7ab8e0"/>
      <stop offset="50%" stop-color="#4a90c4"/>
      <stop offset="100%" stop-color="#1a4a70"/>
    </radialGradient>
    <radialGradient id="bEyeGlow" cx="30%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="bBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="bSoftBlur">
      <feGaussianBlur stdDeviation="0.8"/>
    </filter>
    <linearGradient id="bHair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c8a850"/>
      <stop offset="40%" stop-color="#b89038"/>
      <stop offset="100%" stop-color="#8a6820"/>
    </linearGradient>
    <linearGradient id="bHairLight" x1="0%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#e8c870"/>
      <stop offset="100%" stop-color="#c8a850"/>
    </linearGradient>
    <linearGradient id="bShirt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6c5ce7"/>
      <stop offset="100%" stop-color="#4834b8"/>
    </linearGradient>
    <radialGradient id="bLip" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#e89080"/>
      <stop offset="100%" stop-color="#c06855"/>
    </radialGradient>
    <radialGradient id="bBlush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0a8a8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f0a8a8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="110" r="95" fill="url(#bBg)"/>
  <circle cx="100" cy="110" r="95" fill="none" stroke="#8b5cf6" stroke-width="2" opacity="0.4"/>

  <!-- Neck -->
  <rect x="83" y="150" width="34" height="28" rx="8" fill="url(#bSkin)"/>

  <!-- Shirt / shoulders -->
  <path d="M30 220 Q30 180 60 172 Q80 165 100 165 Q120 165 140 172 Q170 180 170 220Z" fill="url(#bShirt)"/>
  <!-- Shirt collar -->
  <path d="M85 170 L100 192 L115 170" fill="none" stroke="#8b5cf6" stroke-width="1.5" opacity="0.5"/>

  <!-- Face base -->
  <ellipse cx="100" cy="106" rx="51" ry="58" fill="url(#bSkin)"/>
  <ellipse cx="100" cy="106" rx="51" ry="58" fill="url(#bFaceShadow)"/>

  <!-- Freckles -->
  <circle cx="85" cy="108" r="1.2" fill="#c8856a" opacity="0.4"/>
  <circle cx="92" cy="106" r="0.9" fill="#c8856a" opacity="0.35"/>
  <circle cx="108" cy="106" r="0.9" fill="#c8856a" opacity="0.35"/>
  <circle cx="115" cy="108" r="1.2" fill="#c8856a" opacity="0.4"/>
  <circle cx="90" cy="112" r="0.8" fill="#c8856a" opacity="0.3"/>
  <circle cx="110" cy="112" r="0.8" fill="#c8856a" opacity="0.3"/>

  <!-- Blush -->
  <ellipse cx="72" cy="112" rx="16" ry="10" fill="url(#bBlush)" filter="url(#bBlur)"/>
  <ellipse cx="128" cy="112" rx="16" ry="10" fill="url(#bBlush)" filter="url(#bBlur)"/>

  <!-- ===== HAIR ===== -->
  <!-- Hair back -->
  <ellipse cx="100" cy="65" rx="53" ry="40" fill="#8a6820"/>
  <!-- Main hair -->
  <path d="M49 90 Q46 60 62 46 Q78 34 100 32 Q122 34 138 46 Q154 60 151 90 Q144 70 136 62 Q120 52 100 50 Q80 52 64 62 Q56 70 49 90Z" fill="url(#bHair)"/>
  <!-- Hair highlights -->
  <path d="M70 55 Q80 44 100 40 Q112 42 122 50" fill="none" stroke="url(#bHairLight)" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <!-- Swoopy front piece -->
  <path d="M58 68 Q62 52 72 44 Q82 38 95 38 Q88 46 82 56 Q72 62 65 72Z" fill="url(#bHairLight)" opacity="0.8"/>
  <!-- Side part detail -->
  <path d="M82 40 Q88 50 88 62" fill="none" stroke="#e8c870" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <!-- Hair strands -->
  <path d="M62 60 Q68 50 78 46" fill="none" stroke="#d4a840" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <path d="M138 60 Q132 50 122 46" fill="none" stroke="#d4a840" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <!-- Sideburns -->
  <path d="M50 88 Q47 100 49 110" fill="none" stroke="#b89038" stroke-width="5" stroke-linecap="round"/>
  <path d="M150 88 Q153 100 151 110" fill="none" stroke="#b89038" stroke-width="5" stroke-linecap="round"/>

  <!-- ===== EYEBROWS (soft, lighter) ===== -->
  <path d="M68 82 Q79 77 90 80" fill="none" stroke="#9a7830" stroke-width="3" stroke-linecap="round"/>
  <path d="M110 80 Q121 77 132 82" fill="none" stroke="#9a7830" stroke-width="3" stroke-linecap="round"/>

  <!-- ===== EYES ===== -->
  <!-- Left eye -->
  <ellipse cx="80" cy="97" rx="12" ry="9" fill="white"/>
  <ellipse cx="81" cy="98" rx="8.5" ry="7.5" fill="url(#bEye)"/>
  <ellipse cx="81" cy="98" rx="5" ry="5" fill="#1a3050"/>
  <ellipse cx="78" cy="95" rx="2.8" ry="2.8" fill="url(#bEyeGlow)"/>
  <!-- Left eyelashes -->
  <path d="M68 97 Q74 91 80 89 Q86 91 92 97" fill="none" stroke="#8a6820" stroke-width="2" stroke-linecap="round"/>
  <!-- Lower lash line -->
  <path d="M70 100 Q80 104 90 100" fill="none" stroke="#c8a850" stroke-width="0.8" opacity="0.4"/>

  <!-- Right eye -->
  <ellipse cx="120" cy="97" rx="12" ry="9" fill="white"/>
  <ellipse cx="121" cy="98" rx="8.5" ry="7.5" fill="url(#bEye)"/>
  <ellipse cx="121" cy="98" rx="5" ry="5" fill="#1a3050"/>
  <ellipse cx="118" cy="95" rx="2.8" ry="2.8" fill="url(#bEyeGlow)"/>
  <!-- Right eyelashes -->
  <path d="M108 97 Q114 91 120 89 Q126 91 132 97" fill="none" stroke="#8a6820" stroke-width="2" stroke-linecap="round"/>
  <!-- Lower lash line -->
  <path d="M110 100 Q120 104 130 100" fill="none" stroke="#c8a850" stroke-width="0.8" opacity="0.4"/>

  <!-- ===== NOSE ===== -->
  <path d="M98 108 Q95 120 93 124 Q97 127 100 127 Q103 127 107 124 Q105 120 102 108Z" fill="#d4956a" opacity="0.2"/>
  <!-- Nose tip -->
  <ellipse cx="95" cy="124" rx="3.5" ry="2" fill="#d4956a" opacity="0.4"/>
  <ellipse cx="105" cy="124" rx="3.5" ry="2" fill="#d4956a" opacity="0.4"/>
  <!-- Bridge line -->
  <path d="M98 108 L97 120" fill="none" stroke="#d4956a" stroke-width="0.8" opacity="0.3"/>

  <!-- ===== LIPS ===== -->
  <!-- Upper lip -->
  <path d="M87 135 Q91 130 100 129 Q109 130 113 135 Q106 132 100 133 Q94 132 87 135Z" fill="url(#bLip)"/>
  <!-- Lower lip -->
  <path d="M87 135 Q89 143 100 145 Q111 143 113 135 Q107 140 100 141 Q93 140 87 135Z" fill="#e89080"/>
  <!-- Lip highlight -->
  <path d="M93 138 Q100 136 107 138" fill="none" stroke="#f5b8a8" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <!-- Cupid bow -->
  <path d="M89 135 Q94 130 100 129 Q106 130 111 135" fill="none" stroke="#c06855" stroke-width="0.8" opacity="0.5"/>

  <!-- Dimples (more pronounced) -->
  <circle cx="86" cy="138" r="2" fill="#d4956a" opacity="0.25"/>
  <circle cx="114" cy="138" r="2" fill="#d4956a" opacity="0.25"/>

  <!-- Ear left -->
  <ellipse cx="49" cy="108" rx="7" ry="10" fill="#ecc0a0"/>
  <path d="M51 100 Q47 108 51 116" fill="none" stroke="#d4a880" stroke-width="1.5"/>
  <!-- Ear right -->
  <ellipse cx="151" cy="108" rx="7" ry="10" fill="#ecc0a0"/>
  <path d="M149 100 Q153 108 149 116" fill="none" stroke="#d4a880" stroke-width="1.5"/>
  <!-- Small earring left -->
  <circle cx="43" cy="114" r="2.5" fill="#c4b5fd" stroke="#8b5cf6" stroke-width="0.5"/>

  <!-- Glow at bottom -->
  <ellipse cx="100" cy="210" rx="60" ry="8" fill="#8b5cf6" opacity="0.2" filter="url(#bBlur)"/>

  <!-- Sparkle accents -->
  <circle cx="158" cy="52" r="2" fill="#8b5cf6" opacity="0.8"/>
  <circle cx="42" cy="65" r="1.5" fill="#c4b5fd" opacity="0.6"/>
  <circle cx="165" cy="80" r="1" fill="#8b5cf6" opacity="0.7"/>
  <path d="M155 42 L157 38 L159 42 L163 44 L159 46 L157 50 L155 46 L151 44Z" fill="#c4b5fd" opacity="0.5" transform="scale(0.7) translate(65,18)"/>
</svg>
