<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <defs>
    <radialGradient id="gSkin" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#d4956a"/>
      <stop offset="100%" stop-color="#b8733f"/>
    </radialGradient>
    <radialGradient id="gFaceShadow" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#9a5c2a" stop-opacity="0.3"/>
    </radialGradient>
    <radialGradient id="gBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3d1a2e"/>
      <stop offset="100%" stop-color="#1a0d1a"/>
    </radialGradient>
    <radialGradient id="gEye" cx="35%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#5c3a1e"/>
      <stop offset="60%" stop-color="#2e1a0a"/>
      <stop offset="100%" stop-color="#1a0d05"/>
    </radialGradient>
    <radialGradient id="gEyeGlow" cx="30%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="gBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="gSoftBlur">
      <feGaussianBlur stdDeviation="0.8"/>
    </filter>
    <clipPath id="gFaceClip">
      <ellipse cx="100" cy="105" rx="52" ry="60"/>
    </clipPath>
    <linearGradient id="gHair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0d05"/>
      <stop offset="50%" stop-color="#2d1a0a"/>
      <stop offset="100%" stop-color="#0d0703"/>
    </linearGradient>
    <linearGradient id="gShirt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c0392b"/>
      <stop offset="100%" stop-color="#7b241c"/>
    </linearGradient>
    <radialGradient id="gLip" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#c0604a"/>
      <stop offset="100%" stop-color="#8b3a28"/>
    </radialGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="110" r="95" fill="url(#gBg)"/>
  <circle cx="100" cy="110" r="95" fill="none" stroke="#f43f5e" stroke-width="2" opacity="0.4"/>

  <!-- Neck -->
  <rect x="82" y="148" width="36" height="30" rx="8" fill="url(#gSkin)"/>

  <!-- Shirt / shoulders -->
  <path d="M30 220 Q30 180 60 172 Q80 165 100 165 Q120 165 140 172 Q170 180 170 220Z" fill="url(#gShirt)"/>
  <!-- Shirt collar V -->
  <path d="M84 170 L100 195 L116 170" fill="none" stroke="#e74c3c" stroke-width="1.5" opacity="0.6"/>

  <!-- Face base -->
  <ellipse cx="100" cy="105" rx="52" ry="60" fill="url(#gSkin)"/>
  <ellipse cx="100" cy="105" rx="52" ry="60" fill="url(#gFaceShadow)"/>

  <!-- Jawline definition -->
  <ellipse cx="100" cy="148" rx="38" ry="18" fill="#b8733f" opacity="0.3" filter="url(#gSoftBlur)"/>

  <!-- Cheekbones highlight -->
  <ellipse cx="72" cy="108" rx="14" ry="9" fill="#e8a57a" opacity="0.35" filter="url(#gBlur)"/>
  <ellipse cx="128" cy="108" rx="14" ry="9" fill="#e8a57a" opacity="0.35" filter="url(#gBlur)"/>

  <!-- ===== HAIR ===== -->
  <!-- Main hair mass -->
  <path d="M48 95 Q44 60 60 48 Q75 35 100 32 Q125 35 140 48 Q156 60 152 95 Q145 78 138 72 Q125 58 100 56 Q75 58 62 72 Q55 78 48 95Z" fill="url(#gHair)"/>
  <!-- Side swoops -->
  <path d="M48 95 Q42 85 45 70 Q50 55 62 48" fill="none" stroke="#1a0d05" stroke-width="8" stroke-linecap="round"/>
  <path d="M152 95 Q158 85 155 70 Q150 55 138 48" fill="none" stroke="#1a0d05" stroke-width="8" stroke-linecap="round"/>
  <!-- Wavy top hair -->
  <path d="M65 54 Q75 42 100 38 Q125 42 135 54 Q122 48 100 46 Q78 48 65 54Z" fill="#0d0703"/>
  <!-- Hair strand details -->
  <path d="M68 60 Q72 52 80 48" fill="none" stroke="#3d2010" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M132 60 Q128 52 120 48" fill="none" stroke="#3d2010" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <!-- Sideburns -->
  <path d="M50 90 Q47 102 49 112" fill="none" stroke="#1a0d05" stroke-width="6" stroke-linecap="round"/>
  <path d="M150 90 Q153 102 151 112" fill="none" stroke="#1a0d05" stroke-width="6" stroke-linecap="round"/>

  <!-- ===== EYEBROWS ===== -->
  <path d="M68 82 Q80 77 90 79" fill="none" stroke="#1a0a04" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M110 79 Q120 77 132 82" fill="none" stroke="#1a0a04" stroke-width="3.5" stroke-linecap="round"/>

  <!-- ===== EYES ===== -->
  <!-- Left eye -->
  <ellipse cx="80" cy="97" rx="12" ry="9" fill="white"/>
  <ellipse cx="80" cy="97" rx="12" ry="9" fill="none" stroke="#c8856a" stroke-width="0.5" opacity="0.4"/>
  <ellipse cx="81" cy="98" rx="8" ry="7.5" fill="url(#gEye)"/>
  <ellipse cx="81" cy="98" rx="5" ry="5" fill="#1a0d08"/>
  <ellipse cx="78" cy="95" rx="2.5" ry="2.5" fill="url(#gEyeGlow)"/>
  <!-- Left eyelashes -->
  <path d="M68 97 Q74 91 80 89 Q86 91 92 97" fill="none" stroke="#1a0a04" stroke-width="2" stroke-linecap="round"/>
  <path d="M68 97 Q67 93 69 91" fill="none" stroke="#1a0a04" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M92 97 Q93 93 91 91" fill="none" stroke="#1a0a04" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Right eye -->
  <ellipse cx="120" cy="97" rx="12" ry="9" fill="white"/>
  <ellipse cx="120" cy="97" rx="12" ry="9" fill="none" stroke="#c8856a" stroke-width="0.5" opacity="0.4"/>
  <ellipse cx="121" cy="98" rx="8" ry="7.5" fill="url(#gEye)"/>
  <ellipse cx="121" cy="98" rx="5" ry="5" fill="#1a0d08"/>
  <ellipse cx="118" cy="95" rx="2.5" ry="2.5" fill="url(#gEyeGlow)"/>
  <!-- Right eyelashes -->
  <path d="M108 97 Q114 91 120 89 Q126 91 132 97" fill="none" stroke="#1a0a04" stroke-width="2" stroke-linecap="round"/>
  <path d="M108 97 Q107 93 109 91" fill="none" stroke="#1a0a04" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M132 97 Q133 93 131 91" fill="none" stroke="#1a0a04" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Under-eye definition -->
  <path d="M69 101 Q80 106 91 101" fill="none" stroke="#b8733f" stroke-width="0.8" opacity="0.5"/>
  <path d="M109 101 Q120 106 131 101" fill="none" stroke="#b8733f" stroke-width="0.8" opacity="0.5"/>

  <!-- ===== NOSE ===== -->
  <path d="M97 108 Q94 120 92 124 Q96 126 100 126 Q104 126 108 124 Q106 120 103 108Z" fill="#b8733f" opacity="0.25"/>
  <path d="M97 108 L95 122 Q96 124 100 125 Q104 124 105 122 L103 108" fill="none" stroke="#9a5c2a" stroke-width="1" opacity="0.5"/>
  <!-- Nostrils -->
  <ellipse cx="94" cy="124" rx="4" ry="2.5" fill="#9a5c2a" opacity="0.6"/>
  <ellipse cx="106" cy="124" rx="4" ry="2.5" fill="#9a5c2a" opacity="0.6"/>

  <!-- ===== LIPS ===== -->
  <!-- Upper lip -->
  <path d="M86 136 Q90 132 100 131 Q110 132 114 136 Q107 133 100 134 Q93 133 86 136Z" fill="url(#gLip)"/>
  <!-- Lower lip -->
  <path d="M86 136 Q88 143 100 144 Q112 143 114 136 Q107 140 100 141 Q93 140 86 136Z" fill="#c0604a"/>
  <!-- Lip highlight -->
  <path d="M93 138 Q100 136 107 138" fill="none" stroke="#e8907a" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <!-- Cupid's bow -->
  <path d="M88 136 Q94 132 100 131 Q106 132 112 136" fill="none" stroke="#8b3a28" stroke-width="0.8" opacity="0.5"/>

  <!-- Dimple hint -->
  <circle cx="87" cy="138" r="1.5" fill="#9a5c2a" opacity="0.3"/>

  <!-- ===== SUBTLE FACIAL HAIR ===== -->
  <path d="M86 136 Q88 148 100 150 Q112 148 114 136" fill="none" stroke="#2d1a0a" stroke-width="1" stroke-dasharray="1.5,2" opacity="0.5"/>

  <!-- Ear left -->
  <ellipse cx="48" cy="108" rx="8" ry="10" fill="#c8855a"/>
  <path d="M50 100 Q46 108 50 116" fill="none" stroke="#b0704a" stroke-width="2"/>
  <!-- Ear right -->
  <ellipse cx="152" cy="108" rx="8" ry="10" fill="#c8855a"/>
  <path d="M150 100 Q154 108 150 116" fill="none" stroke="#b0704a" stroke-width="2"/>

  <!-- Name tag glow at bottom -->
  <ellipse cx="100" cy="210" rx="60" ry="8" fill="#f43f5e" opacity="0.2" filter="url(#gBlur)"/>

  <!-- Sparkle accents -->
  <circle cx="158" cy="52" r="2" fill="#f43f5e" opacity="0.8"/>
  <circle cx="42" cy="65" r="1.5" fill="#f43f5e" opacity="0.6"/>
  <circle cx="165" cy="80" r="1" fill="#fda4af" opacity="0.7"/>
</svg>
